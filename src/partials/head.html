<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta property="og:site_name" content="MorsEye" />
<meta property="og:image" content="https://morseye.pages.dev/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<script>
  // Apply the saved theme before first paint (no flash). Storage may be unavailable.
  try {
    var t = localStorage.getItem('morseye-theme');
    if (t === 'light' || t === 'dark' || t === 'contrast')
      document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
