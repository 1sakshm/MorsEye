<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Fonts load without blocking the first paint; the system fallback shows until they arrive. -->
<link
  rel="preload"
  as="style"
  href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap"
  media="print"
  onload="this.media = 'all'"
/>
<noscript
  ><link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap"
/></noscript>
<meta property="og:site_name" content="MorsEye" />
<meta property="og:image" content="https://morseye.pages.dev/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<script>
  // Apply the saved theme before first paint (no flash). Storage may be unavailable.
  try {
    var t = localStorage.getItem('morseye-theme');
    if (t === 'light' || t === 'dark' || t === 'contrast')
      document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
